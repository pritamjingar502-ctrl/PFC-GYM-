<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFC Gym Manager</title>
<style>
:root{--bg:#0d0d0d;--sf:#1a1a1a;--ln:#333;--tx:#f4f4f4;--mu:#9a9a9a;--y:#ffd21a;--ok:#4cd07d;--wn:#ffa23a;--er:#ff5a5a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:76px}
h1,h2{font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.5px;font-weight:400;margin:0}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid var(--y)}
header img{width:46px;height:46px;border-radius:50%}
header h1{font-size:20px;color:var(--y)}header small{color:var(--mu)}
main{padding:14px 16px;max-width:640px;margin:auto}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.n{font:28px Impact,sans-serif;color:var(--y)}.l{color:var(--mu);font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--ln)}
.r:last-child{border:0}.r b{display:block}.r span{color:var(--mu);font-size:13px}
.tg{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
button,input,select{font:inherit;color:var(--tx)}
.b{background:var(--y);color:#111;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.b.s{padding:6px 10px;font-size:13px}.b.o{background:none;color:var(--y);border:1px solid var(--y)}
input,select{width:100%;background:#111;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:4px 0 10px}
input:focus,select:focus,button:focus-visible,nav button:focus-visible{outline:2px solid var(--y)}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar input{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:2px solid var(--y);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--mu);font-size:13px}
nav button.on{color:var(--y);font-weight:700}
#sh{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#sh.on{display:flex}
#sh div{background:var(--sf);width:100%;max-width:640px;margin:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--y)}
.em{color:var(--mu);text-align:center;padding:24px 0}
</style></head><body>

<main id="v"></main>
<nav id="nv"></nav><div id="sh"><div id="shc"></div></div>
<script>
const $=s=>document.querySelector(s);
let db={m:[],p:[],s:[],x:[]},tab='home',q='';
try{db=Object.assign(db,JSON.parse(localStorage.getItem('pfc')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pfc',JSON.stringify(db))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};
const diff=d=>Math.ceil((new Date(d)-new Date(today()))/864e5);
const rs=n=>'₹'+Number(n).toLocaleString('en-IN');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const st=m=>{const d=diff(m.exp);return d<0?['Expired','er']:d<=7?['Due in '+d+'d','wn']:['Active','ok']};
const mon=()=>today().slice(0,7);
function sheet(t,f,cb){
 $('#shc').innerHTML='<h2 style="color:var(--y);font-size:20px;margin-bottom:10px">'+t+'</h2>'+f.map(x=>'<label class="l">'+x.l+(x.o?'<select id="f_'+x.k+'">'+x.o.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select>':'<input id="f_'+x.k+'" type="'+(x.t||'text')+'" value="'+(x.v??'')+'">')+'</label>').join('')+'<div class="bar"><button class="b o" style="flex:1" onclick="shut()">Cancel</button><button class="b" style="flex:1" id="ok">Save</button></div>';
 $('#sh').classList.add('on');
 $('#ok').onclick=()=>{const v={};f.forEach(x=>v[x.k]=$('#f_'+x.k).value.trim());if(f.some(x=>x.req&&!v[x.k]))return alert('Please fill all required fields.');cb(v);save();shut();draw()};
}
const shut=()=>$('#sh').classList.remove('on');
const PL=[[1,'1 month'],[3,'3 months'],[6,'6 months'],[12,'12 months']];
function addMember(){sheet('New member',[{k:'name',l:'Name',req:1},{k:'ph',l:'Phone',t:'tel'},{k:'pl',l:'Plan',o:PL},{k:'fee',l:'Fee paid (₹)',t:'number',req:1},{k:'st',l:'Start date',t:'date',v:today()}],v=>{
 const m={id:uid(),name:v.name,ph:v.ph,exp:addM(v.st,+v.pl),joined:v.st};db.m.push(m);db.p.push({id:uid(),mid:m.id,amt:+v.fee,date:v.st,mo:+v.pl})})}
function renew(id){const m=db.m.find(x=>x.id==id);sheet('Collect fee · '+m.name,[{k:'pl',l:'Plan',o:PL},{k:'fee',l:'Amount (₹)',t:'number',req:1},{k:'dt',l:'Paid on',t:'date',v:today()}],v=>{
 const base=diff(m.exp)>0?m.exp:v.dt;m.exp=addM(base,+v.pl);db.p.push({id:uid(),mid:id,amt:+v.fee,date:v.dt,mo:+v.pl})})}
function delM(id){if(confirm('Delete this member and their records?')){db.m=db.m.filter(x=>x.id!=id);db.p=db.p.filter(x=>x.mid!=id);save();draw()}}
function addItem(){sheet('New supplement',[{k:'n',l:'Product name',req:1},{k:'q',l:'Opening stock',t:'number',v:0},{k:'p',l:'Selling price (₹)',t:'number',req:1},{k:'mn',l:'Alert when below',t:'number',v:3}],v=>db.s.push({id:uid(),n:v.n,q:+v.q,p:+v.p,mn:+v.mn}))}
function sell(id){const i=db.s.find(x=>x.id==id);sheet('Sell · '+i.n,[{k:'q',l:'Quantity (in stock: '+i.q+')',t:'number',v:1},{k:'p',l:'Price each (₹)',t:'number',v:i.p}],v=>{
 if(+v.q>i.q||+v.q<1){alert('Only '+i.q+' in stock.');return}i.q-=+v.q;db.x.push({id:uid(),iid:id,n:i.n,q:+v.q,amt:+v.q*+v.p,date:today()})})}
function stock(id){const i=db.s.find(x=>x.id==id);sheet('Add stock · '+i.n,[{k:'q',l:'Quantity received',t:'number',req:1}],v=>{i.q+=+v.q})}
function delI(id){if(confirm('Remove this product?')){db.s=db.s.filter(x=>x.id!=id);save();draw()}}
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const V={
home(){const a=db.m.filter(m=>diff(m.exp)>=0).length,due=db.m.filter(m=>{const d=diff(m.exp);return d>=0&&d<=7}),ex=db.m.filter(m=>diff(m.exp)<0),
 fe=sum(db.p.filter(p=>p.date.startsWith(mon())),p=>p.amt),sa=sum(db.x.filter(p=>p.date.startsWith(mon())),p=>p.amt),low=db.s.filter(i=>i.q<i.mn);
 const lst=(t,a,fn)=>a.length?'<div class="c" style="margin-top:10px"><b>'+t+'</b>'+a.map(fn).join('')+'</div>':'';
 return '<div class="g"><div class="c"><div class="n">'+a+'</div><div class="l">Active members</div></div><div class="c"><div class="n">'+(due.length+ex.length)+'</div><div class="l">Fees to collect</div></div><div class="c"><div class="n">'+rs(fe)+'</div><div class="l">Fees this month</div></div><div class="c"><div class="n">'+rs(sa)+'</div><div class="l">Supplement sales this month</div></div></div>'+
 lst('Fees to collect',[...ex,...due],m=>'<div class="r"><div>'+m.name+'<span> · '+st(m)[0]+'</span></div><button class="b s" onclick="renew(\''+m.id+'\')">Collect</button></div>')+
 lst('Low stock',low,i=>'<div class="r"><div>'+i.n+'<span class="er"> · '+i.q+' left</span></div><button class="b s" onclick="stock(\''+i.id+'\')">Add stock</button></div>')+
 (db.m.length?'':'<div class="em">Add your first member to get started.</div>')},
members(){const a=db.m.filter(m=>(m.name+m.ph).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>x.exp<y.exp?-1:1);
 return '<div class="bar"><input placeholder="Search name or phone" value="'+q+'" oninput="q=this.value;draw(1)"><button class="b" onclick="addMember()">Add</button></div><div class="c" id="lst">'+(a.length?a.map(m=>{const s=st(m);return '<div class="r"><div><b>'+m.name+'</b><span>'+(m.ph||'No phone')+' · Expires '+m.exp+'</span></div><div style="text-align:right"><span class="tg '+s[1]+'">'+s[0]+'</span><br><button class="b s o" style="margin-top:6px" onclick="renew(\''+m.id+'\')">Renew</button> <button class="b s o" style="margin-top:6px;color:var(--er);border-color:var(--er)" onclick="delM(\''+m.id+'\')">×</button></div></div>'}).join(''):'<div class="em">No members found.</div>')+'</div>'},
fees(){const a=[...db.p].sort((x,y)=>x.date<y.date?1:-1).slice(0,50);
 return '<div class="c" style="margin-bottom:10px"><div class="n">'+rs(sum(db.p.filter(p=>p.date.startsWith(mon())),p=>p.amt))+'</div><div class="l">Collected this month · '+rs(sum(db.p,p=>p.amt))+' all time</div></div><div class="c">'+(a.length?a.map(p=>{const m=db.m.find(x=>x.id==p.mid);return '<div class="r"><div><b>'+(m?m.name:'Deleted member')+'</b><span>'+p.date+' · '+p.mo+' mo</span></div><b class="ok">'+rs(p.amt)+'</b></div>'}).join(''):'<div class="em">No payments yet. Collect a fee from the Members tab.</div>')+'</div>'},
stock(){return '<div class="bar"><div class="c" style="flex:1;padding:8px 12px"><span class="l">Stock value</span><br><b>'+rs(sum(db.s,i=>i.q*i.p))+'</b></div><button class="b" onclick="addItem()">Add</button></div><div class="c">'+(db.s.length?db.s.map(i=>'<div class="r"><div><b>'+i.n+'</b><span>'+rs(i.p)+' each · </span><span class="'+(i.q<i.mn?'er':'ok')+'">'+i.q+' in stock</span></div><div><button class="b s" onclick="sell(\''+i.id+'\')">Sell</button> <button class="b s o" onclick="stock(\''+i.id+'\')">+</button> <button class="b s o" style="color:var(--er);border-color:var(--er)" onclick="delI(\''+i.id+'\')">×</button></div></div>').join(''):'<div class="em">No supplements yet. Add your first product.</div>')+'</div>'}
};
const T=[['home','Home'],['members','Members'],['fees','Fees'],['stock','Supplements']];
function draw(keep){const f=document.activeElement&&document.activeElement.tagName=='INPUT'&&keep;
 $('#v').innerHTML=V[tab]();$('#nv').innerHTML=T.map(t=>'<button class="'+(t[0]==tab?'on':'')+'" onclick="tab=\''+t[0]+'\';q=\'\';draw()">'+t[1]+'</button>').join('');
 if(f){const i=$('#v input');i.focus();i.setSelectionRange(q.length,q.length)}}
draw();
</script></body></html>

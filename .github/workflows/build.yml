name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Make app icons
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open('assets/icon-only.png').convert('RGBA')
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          for d, s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              im = src.resize((s, s), Image.LANCZOS)
              mask = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s-1, s-1), fill=255)
              rd = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              rd.paste(im, (0, 0), mask)
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im.save(p + '/ic_launcher.png')
              rd.save(p + '/ic_launcher_round.png')
          EOF
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PFC-Gym-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
